<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
<title>Prompt Interactions</title>
<script src="js/platform.js"></script>
<script src="js/spin.min.js"></script>
<script src="js/functions.js"></script>
<script src="js/api_adapters.js"></script>
<script src="js/prompts.js"></script>
<script src="js/popup.js"></script>
<link rel="stylesheet" type="text/css" href="css/popup.css">
</head>
<body>
  <div id="inline_scratch">
    <div class="file_menu">
      <a href="#" id="open_scratch" class="files">Open</a>  
      <input type="file" id="fileInput" style="display: none;"/>
      <a href="#" id="save_scratch" class="files">Save</a>   
    </div>
    <div class="scratch_frame">
      <textarea id="scratch_pad" placeholder="This space holds text for use with the prompt interactions found to the right."></textarea>
    </div>
  </div> 
  <div id="panel_resize_handle" role="separator" aria-orientation="vertical" aria-label="Resize Scratch Pad and interactions" tabindex="0"></div>
  <div id="main_wrapper">
    <div id="inner_wrapper">
      <!--
        START CUSTOM CONTENT
      -->
      <div class="custom_header"></div>
      <!--
        END CUSTOM CONTENT
      -->
      <div id="stop_generation" style="display:none;">
        <button id="stopGenerationButton" type="button">Stop generation</button>
      </div>
      <div id="button_list"></div>
      <div id="transcript" style="display:none;">
        <div id="output_window"></div>
      </div>
      <div id="thinking_box">
        <div id="thinking"></div>
      </div>
      <div id="text_input" style="display:none;">
        <textarea id="user_input"></textarea>
        <button id="send">Send</button>
        <button id="restartButton_companion">Back Home</button>
      </div>
      <div id="chat_text_input" style="display:none;">
        <textarea id="chat_user_input"></textarea>
        <button id="chat_send">Send</button>
        <button id="restartButton_companion_chat">Back Home</button>
      </div>
      <div id="continue_gen" style="display:none;">
        <button id='continueButton'>Continue text generation</button>
      </div>
      <button id="restartButton">Back Home</button>
      <div class="transcript-actions" aria-label="Transcript actions">
        <a href="#" id="save_transcript" class="transcript-control-link">SAVE TRANSCRIPT</a>
        <!-- BEGIN EXTENSION-ONLY LOGGING -->
        <span id="transcript_action_separator" class="transcript-action-separator" aria-hidden="true">&middot;</span>
        <a href="#" id="logs_toggle" class="transcript-control-link" aria-expanded="false" aria-controls="debug_log_card">LOGS</a>
        <!-- END EXTENSION-ONLY LOGGING -->
      </div>
      <!-- BEGIN EXTENSION-ONLY LOGGING -->
      <div id="debug_log_card" class="debug-log-card" hidden>
        <h3>Interaction logs</h3>
        <div id="debug_log_entries"></div>
      </div>
      <!-- END EXTENSION-ONLY LOGGING -->
      <div id="credentials" style="display:none;">
        <table id="credentials_table">
          <tr><td>API&nbsp;Endpoint:&nbsp;</td><td width="100%"><input id="api_base" style="width:100%"></td></tr>
          <tr><td>API&nbsp;Key:&nbsp;</td><td width="100%"><input id="api_key" style="width:100%"></td></tr>
        </table>        
        <button id='credentialsButton'>Update/Save Credentials</button>
      </div>
    </div>
  </div>
  <div class="footer">
    <button id="config">Templates &amp; Settings</button>
    <button id="scratch">Scratch Pad</button>
    <span style="float:right">
      <button id="about">About</button>
      <button id="feedback">Feedback</button>
    </span>
  </div>
</body>
</html>
